name: Publicar dashboard de portafolio

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/publicar-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Cargar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
